# Publishes one package to npm, with provenance, from this repository only.
#
# Never runs by itself: it is started by hand (workflow_dispatch) and then waits for the owner to approve the
# `npm-publish` environment. There is no npm token in this repository or in its secrets. npm trusts this exact
# workflow file through trusted publishing (OpenID Connect), and `--provenance` ties the tarball to this commit.
# Every run only stages the version; it becomes public when the owner approves it on npmjs.com with 2FA.
#
# It refuses to publish when the package is still `"private": true` or when that version already exists on npm.
name: publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: Which package to publish
        required: true
        type: choice
        options:
          - sdk
          - cli

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Required reviewers on this environment are the owner's approval.
    environment: npm-publish
    permissions:
      id-token: write
      contents: read
    env:
      PACKAGE: ${{ inputs.package }}
      HAS_FIRST_PUBLISH_TOKEN: ${{ secrets.NPM_FIRST_PUBLISH_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.2
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      # Trusted publishing needs npm 11.5.1 or newer, `npm stage publish` (the first version) a current npm 11.
      - name: Use npm 11.21.2
        run: |
          npm install --global npm@11.21.2
          npm --version

      - name: Read the package
        id: package
        run: |
          case "$PACKAGE" in
            sdk|cli) ;;
            *) echo "::error::package must be sdk or cli"; exit 1 ;;
          esac
          node -e '
            const m = JSON.parse(require("node:fs").readFileSync(`packages/${process.env.PACKAGE}/package.json`, "utf8"));
            const out = [`name=${m.name}`, `version=${m.version}`, `private=${m.private === true}`].join("\n");
            require("node:fs").appendFileSync(process.env.GITHUB_OUTPUT, out + "\n");
          '

      - name: Refuse a private package
        if: steps.package.outputs.private == 'true'
        run: |
          echo "::error::${{ steps.package.outputs.name }} is still private. Removing \"private\": true is the owner's release step."
          exit 1

      - name: Refuse a version that already exists
        run: |
          name="${{ steps.package.outputs.name }}"
          version="${{ steps.package.outputs.version }}"
          if found="$(npm view "$name@$version" version 2>/dev/null)" && [ -n "$found" ]; then
            echo "::error::$name@$version is already on npm. Bump the version."
            exit 1
          fi

      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test
      - name: Pack check, expecting a public package
        run: node "scripts/pack-${PACKAGE}.mjs" --release

      # The very first version of a package name cannot use trusted publishing yet: npm attaches a trusted publisher
      # to an existing package. For that one run the owner stores a short-lived granular token (without the 2FA bypass)
      # as the environment secret NPM_FIRST_PUBLISH_TOKEN. The run only stages the version (`npm stage publish` needs
      # no one-time password); it becomes public when the owner approves it on npmjs.com with 2FA. Provenance comes
      # from this run's OIDC identity. The owner then adds the trusted publisher and deletes the token and secret.
      - name: Stage with provenance (first version, short-lived token; the owner approves on npmjs.com)
        if: env.HAS_FIRST_PUBLISH_TOKEN == 'true'
        working-directory: packages/${{ inputs.package }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_FIRST_PUBLISH_TOKEN }}
        run: npm stage publish . --provenance --access public

      # Every later version: trusted publishing, no token. npm's trusted publishers default to "stage only" (since
      # 3 Sep 2026), and staging also works where direct publishing is allowed, so this run stages as well and the
      # owner approves the version on npmjs.com › Staged Packages with 2FA.
      - name: Stage with provenance (trusted publishing; the owner approves on npmjs.com)
        if: env.HAS_FIRST_PUBLISH_TOKEN != 'true'
        working-directory: packages/${{ inputs.package }}
        run: npm stage publish . --provenance --access public
